<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Updated - MindMate</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0d0d1a;--card:#161626;--text:#f4f1ff;--muted:#8888aa;--border:rgba(255,255,255,.1);--purple:#9b7ff4;--green:#4ade80}
    body.theme-light{--bg:#f6f7fb;--card:#ffffff;--text:#171728;--muted:#687085;--border:rgba(20,24,40,.12);--purple:#6d5df5;--green:#10b981}
    body.theme-calm{--bg:#10201d;--card:#172b27;--text:#f2fff9;--muted:#9bb9b0;--border:rgba(255,255,255,.1);--purple:#78dcca;--green:#34d399}
    @media (prefers-color-scheme: light) {
      body.theme-system{--bg:#f6f7fb;--card:#ffffff;--text:#171728;--muted:#687085;--border:rgba(20,24,40,.12);--purple:#6d5df5;--green:#10b981}
    }
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:18px;transition:background 0.3s, color 0.3s}.panel{max-width:520px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px;text-align:center}.mark{width:58px;height:58px;border-radius:18px;margin:0 auto 16px;background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.35);display:grid;place-items:center;color:var(--green);font-size:1.6rem}h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:2rem;margin-bottom:8px}.muted{color:var(--muted);font-size:.9rem;line-height:1.6;margin-bottom:18px}.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:11px 15px;text-decoration:none;font-weight:700;background:var(--purple);color:white}
  </style>
</head>
<body class="theme-{{ request.user.profile.theme }}">
  <main class="panel">
    <div class="mark">✓</div>
    <h1>Password Updated</h1>
    <p class="muted">Your password has been changed successfully. You are still signed in on this device.</p>
    <a class="btn" href="{% url 'settings' %}">Return to settings</a>
  </main>
</body>
</html>
