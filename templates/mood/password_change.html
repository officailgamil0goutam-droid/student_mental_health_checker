<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - MindMate</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0d0d1a;--card:#161626;--text:#f4f1ff;--muted:#8888aa;--border:rgba(255,255,255,.1);--purple:#9b7ff4;--green:#4ade80;--red:#fb7185}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .wrap{max-width:520px;margin:0 auto;padding:40px 24px;}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px;}
    .logo{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-weight:700;font-size:1.1rem;}
    .logo-dot{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--green));}
    .back{color:var(--muted);text-decoration:none;border:1px solid var(--border);border-radius:999px;padding:8px 16px;font-size:.85rem;transition:all .2s;}
    .back:hover{color:var(--text);border-color:rgba(155,127,244,.4);}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px;}
    h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:2rem;margin-bottom:8px;}
    .subtitle{color:var(--muted);font-size:.9rem;margin-bottom:28px;line-height:1.6;}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;}
    label{font-size:.78rem;color:var(--muted);font-weight:500;letter-spacing:.03em;}
    input{width:100%;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;font-size:.92rem;outline:none;transition:border-color .2s;}
    input:focus{border-color:rgba(155,127,244,.55);background:rgba(155,127,244,.05);}
    input::placeholder{color:rgba(255,255,255,.2);}
    .err-box{padding:12px 16px;border-radius:12px;background:rgba(251,113,113,.08);border:1px solid rgba(251,113,113,.2);font-size:.83rem;color:var(--red);margin-bottom:20px;}
    .divider{border:none;border-top:1px solid var(--border);margin:20px 0;}
    .btn{width:100%;padding:13px;border:none;border-radius:14px;background:var(--purple);color:#fff;font-size:.95rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;margin-top:8px;}
    .btn:hover{background:#7b5fd4;transform:translateY(-1px);}
    .hint{font-size:.76rem;color:var(--muted);margin-top:20px;text-align:center;}
    .hint a{color:var(--purple);text-decoration:none;}
    .hint a:hover{text-decoration:underline;}
  </style>
</head>
<body>
  <main class="wrap">

    <div class="top">
      <a class="logo" href="{% url 'userboard' %}">
        <span class="logo-dot"></span>MindMate
      </a>
      <a class="back" href="{% url 'settings' %}">Back to Settings</a>
    </div>

    <div class="panel">
      <h1>Change Password</h1>
      <p class="subtitle">Enter your old password and choose a new one.</p>

      {% if error %}
        <div class="err-box">❌ {{ error }}</div>
      {% endif %}

      <form method="POST" action="{% url 'password_change' %}">
        {% csrf_token %}

        <div class="field">
          <label>Old Password</label>
          <input type="password" name="old_password"
                 placeholder="Enter your current password" required />
        </div>

        <hr class="divider">

        <div class="field">
          <label>New Password</label>
          <input type="password" name="new_password"
                 placeholder="At least 8 characters" required />
        </div>

        <div class="field">
          <label>Confirm New Password</label>
          <input type="password" name="confirm_password"
                 placeholder="Repeat new password" required />
        </div>

        <button type="submit" class="btn">Update Password</button>
      </form>

      <p class="hint">
        Forgot your password?
        <a href="{% url 'forget_password' %}">Reset via email →</a>
      </p>
    </div>

  </main>
</body>
</html>
